<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astana Budget Planner</title>
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48 64x64 256x256" />
    <link rel="icon" type="image/png" sizes="256x256" href="%BASE_URL%favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font Awesome: "nest" puts each <svg> inside its <i> instead of replacing it,
         so React can still change icons after the first render. -->
    <script>window.FontAwesomeConfig = { autoReplaceSvg: "nest" };</script>
    <!-- Font Awesome kit URL comes from VITE_FONTAWESOME_KIT_URL in .env -->
    <script src="%VITE_FONTAWESOME_KIT_URL%" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
