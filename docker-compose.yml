# PostgreSQL for local development. Every value comes from .env (and your
# personal .env.local, if a port had to change), so everyone on the team gets
# the same database, credentials and version.
#   start:  npm start   (or: npm run db:up)        stop:  docker compose stop db
name: hackalem

services:
  db:
    image: postgres:${POSTGRES_VERSION}
    container_name: hackalem-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
      # Runs once, on first start with an empty volume: loads the team snapshot.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
    # One volume per major version, so upgrades never touch the old data.
    name: hackalem-pgdata-${POSTGRES_VERSION}
